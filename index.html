<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Diagnóstico Push ADM</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111827;color:#f9fafb;padding:18px}
.card{max-width:720px;margin:auto;background:#1f2937;border-radius:18px;padding:20px}
h1{font-size:22px;margin:0 0 8px}
p{color:#cbd5e1}
button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;font-size:16px;font-weight:700}
#ativar{background:#22c55e;color:#052e16} #testar{background:#3b82f6;color:white}
#limpar{background:#ef4444;color:white}
pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;padding:14px;border-radius:12px;font-size:12px;min-height:160px}
.ok{color:#86efac}.err{color:#fca5a5}
</style>
</head>
<body>
<div class="card">
<h1>🔔 Diagnóstico Push — ADM</h1>
<p>Teste isolado. Não mexe em pedidos, clientes ou cardápio.</p>
<button id="ativar">1. Ativar Push do ADM</button>
<button id="testar">2. Enviar TESTE pela Edge Function</button>
<button id="limpar">3. Limpar subscription deste teste</button>
<pre id="log">Aguardando...</pre>
</div>

<script>
const SUPABASE_URL = "https://vpeyqgijajywgswmezlh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9";
const VAPID_PUBLIC_KEY = "BIlEWyrcCIfvM2Sj8fIJTOPaUhx5V7m52BRCHykFVinWJaKylTPfUiqSap1mY2NfdPcrn8MNquBqk-CTRZGh7a8";
const EDGE_URL = SUPABASE_URL + "/functions/v1/dynamic-function";
const SW_URL = "./SW-PUSH-TESTE.js";
const SW_SCOPE = "./";
const logEl = document.getElementById("log");

function log(msg, ok=false){
  logEl.innerHTML += (ok ? '<span class="ok">[OK] ' : '[INFO] ') +
    String(msg).replaceAll("&","&amp;").replaceAll("<","&lt;") + "</span>\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function err(msg){
  logEl.innerHTML += '<span class="err">[ERRO] ' +
    String(msg).replaceAll("&","&amp;").replaceAll("<","&lt;") + '</span>\n';
}
function keyToBytes(base64){
  const pad = "=".repeat((4-base64.length%4)%4);
  const raw = atob((base64+pad).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function headers(){
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };
}
async function getReg(){
  return await navigator.serviceWorker.getRegistration(SW_SCOPE);
}
async function ativar(){
  logEl.textContent="";
  try{
    if(!("serviceWorker" in navigator)) throw new Error("Service Worker não suportado.");
    if(!("PushManager" in window)) throw new Error("PushManager não suportado neste navegador.");
    log("Navegador suporta Service Worker e PushManager.");

    const permission = await Notification.requestPermission();
    log("Permissão atual: " + permission);
    if(permission !== "granted") throw new Error("Permissão de notificação não concedida.");

    const reg = await navigator.serviceWorker.register(SW_URL,{scope:SW_SCOPE});
    await navigator.serviceWorker.ready;
    await reg.update();
    log("Service Worker de teste registrado/atualizado.", true);

    let sub = await reg.pushManager.getSubscription();
    if(sub) {
      log("Subscription já existente neste SW. Reutilizando.");
    } else {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:keyToBytes(VAPID_PUBLIC_KEY)
      });
      log("Nova subscription criada.", true);
    }

    const json = sub.toJSON();
    if(!json.endpoint || !json.keys?.p256dh || !json.keys?.auth)
      throw new Error("Subscription incompleta.");

    // Remove apenas endpoints antigos do mesmo endpoint, se existirem.
    const h = await headers();
    const del = await fetch(
      SUPABASE_URL+"/rest/v1/web_push_subscriptions?endpoint=eq."+encodeURIComponent(json.endpoint),
      {method:"DELETE",headers:h}
    );
    if(!del.ok) throw new Error("Falha ao limpar endpoint anterior: "+await del.text());

    const ins = await fetch(SUPABASE_URL+"/rest/v1/web_push_subscriptions",{
      method:"POST",headers:{...h,"Prefer":"return=representation"},
      body:JSON.stringify({
        phone:"ADM",
        destinatario:"adm",
        endpoint:json.endpoint,
        p256dh:json.keys.p256dh,
        auth:json.keys.auth
      })
    });
    if(!ins.ok) throw new Error("Falha ao salvar subscription: "+await ins.text());

    log("Subscription salva em web_push_subscriptions.", true);
    log("Endpoint: "+json.endpoint);
    log("Agora toque em 'Enviar TESTE pela Edge Function'.");
  }catch(e){err(e?.message||e)}
}
async function testar(){
  try{
    const reg = await getReg();
    if(!reg) throw new Error("SW de teste ainda não está registrado. Ative primeiro.");
    const sub = await reg.pushManager.getSubscription();
    if(!sub) throw new Error("Não existe subscription neste SW. Ative primeiro.");

    log("Enviando teste para dynamic-function...");
    const res = await fetch(EDGE_URL,{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({
        notificacao:{
          id:"diagnostico-adm-"+Date.now(),
          phone:null,
          destinatario:"adm",
          titulo:"🔔 TESTE DIAGNÓSTICO ADM",
          mensagem:"Se esta mensagem apareceu, o Push do ADM está funcionando.",
          url:"/"
        }
      })
    });
    const text=await res.text();
    log("Resposta HTTP "+res.status+": "+text, res.ok);
    if(!res.ok) throw new Error(text);
  }catch(e){err(e?.message||e)}
}
async function limpar(){
  try{
    const reg=await getReg();
    if(reg){
      const sub=await reg.pushManager.getSubscription();
      if(sub) await sub.unsubscribe();
      log("Subscription do navegador cancelada.", true);
    }
    log("A limpeza do banco pode ser feita pelo SQL se necessário.");
  }catch(e){err(e?.message||e)}
}
document.getElementById("ativar").onclick=ativar;
document.getElementById("testar").onclick=testar;
document.getElementById("limpar").onclick=limpar;
</script>
</body>
</html>
